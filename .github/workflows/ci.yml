---
name: Kitsu Client CI

on: [push, pull_request]

# A new push to the same branch makes the run in flight pointless: stop it
# instead of paying for it to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the whole devDependency toolchain: give it a token that can
# only read, and keep that token out of the checkout.
permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.12.0 is the documented floor: the first 22.x that require()s ESM.
        node: [22.12.0, 22, 24, current]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Run tests
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Run linter
        run: npm run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: current
          cache: npm
      - name: Install npm dependencies
        run: |
          echo "Node.js $(node -v)"
          echo "npm v$(npm -v)"
          npm ci
      - name: Check types and build declarations
        run: npm run types
      - name: Check the declarations as a consumer
        run: npm run test:types
      # The README promises TypeScript 5.9 to the consumers: the declarations
      # come from a newer compiler, which may emit what 5.9 cannot read.
      - name: Check the declarations with TypeScript 5.9
        run: |
          npm install --no-save typescript@5.9
          node_modules/.bin/tsc -v
          npm run test:types
